<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title></title>
<meta name="description" content="">
<meta name="theme-color" content="#f1f0ec">
<meta property="og:title" content="">
<meta property="og:description" content="">
<meta property="og:type" content="website">

<link rel="icon" href="img/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="img/hero/lineup-desktop.webp" media="(min-width:761px)" fetchpriority="high">
<link rel="preload" as="image" href="img/hero/lineup-mobile.webp" media="(max-width:760px)" fetchpriority="high">
<link rel="stylesheet" href="css/style.css">

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
} }
</script>
</head>

<body>
<canvas id="stage" aria-hidden="true"></canvas>

<header class="nav" id="nav">
  <a class="nav-brand" href="#top">
    <img src="img/logo.svg" alt="">
    <span class="mono"></span>
  </a>
  <nav class="nav-links mono" aria-label="Primary navigation"></nav>
  <div class="nav-more">
    <button class="nav-more-toggle mono" type="button" aria-expanded="false"></button>
    <div class="nav-more-menu mono" hidden></div>
  </div>
  <button class="btn btn-sm nav-cta" type="button" data-lead-intent="pricing" data-source-section="navigation"></button>
  <button class="nav-menu-toggle mono" type="button" aria-expanded="false" aria-controls="mobileMenu">
    <span></span><i></i>
  </button>
  <div class="nav-mobile" id="mobileMenu" hidden>
    <nav class="nav-mobile-links mono" aria-label="Mobile navigation"></nav>
  </div>
</header>

<main id="top">
  <section class="hero" id="hero">
    <picture class="hero-media">
      <source media="(max-width:760px)" srcset="img/hero/lineup-mobile.webp" width="1200" height="1500">
      <img src="img/hero/lineup-desktop.webp" alt="" width="2560" height="1440" fetchpriority="high" decoding="async">
    </picture>
    <div class="wrap hero-grid">
      <div class="hero-copy">
        <p class="eyebrow mono" data-rise></p>
        <h1 class="hero-title" data-lines></h1>
        <p class="hero-sub" data-rise></p>
        <div class="hero-actions" data-rise>
          <button class="btn" type="button" data-lead-intent="pricing" data-source-section="hero"></button>
          <a class="btn btn-ghost" href="#lineup"></a>
        </div>
      </div>
    </div>
    <div class="hero-foot wrap">
      <span class="mono scroll-hint"><i></i></span>
      <ul class="hero-badges mono"></ul>
    </div>
  </section>

  <section class="quiz" id="finder">
    <div class="wrap">
      <div class="quiz-head">
        <p class="eyebrow mono" data-rise></p>
        <h2 class="h2" data-rise></h2>
        <p class="lede" data-rise></p>
      </div>
      <div class="quiz-body"></div>
      <div class="quiz-result" hidden></div>
    </div>
  </section>

  <section class="clients" id="clients">
    <div class="wrap">
      <div class="clients-head">
        <p class="eyebrow mono" data-rise></p>
        <h2 class="h2" data-rise></h2>
        <p class="lede" data-rise></p>
      </div>
      <div class="client-filters mono" data-rise></div>
      <ul class="client-grid"></ul>
      <button class="btn btn-ghost clients-cta" type="button" data-rise></button>
    </div>
  </section>

  <section class="compare" id="compare">
    <div class="wrap">
      <h2 class="h2" data-rise></h2>
      <div class="cmp-scroll" data-rise><table class="cmp"><thead></thead><tbody></tbody></table></div>
    </div>
  </section>

  <section class="calc" id="calc"><div class="wrap"></div></section>

  <div id="lineup"></div>

  <section class="software" id="software" data-dark><div class="wrap"></div></section>

  <section class="service" id="service"><div class="wrap"></div></section>

  <section class="try" id="try"><div class="wrap"></div></section>

  <section class="faq" id="faq">
    <div class="wrap">
      <div class="faq-head">
        <p class="eyebrow mono" data-rise></p>
        <h2 class="h2" data-rise></h2>
      </div>
      <div class="faq-tabs mono" role="tablist" data-rise></div>
      <div class="faq-list" data-rise></div>
    </div>
  </section>

  <section class="cta" id="contact">
    <div class="wrap contact-grid">
      <div class="contact-copy">
        <p class="eyebrow mono" data-rise></p>
        <h2 class="cta-title" data-rise></h2>
        <p class="lede" data-rise></p>
        <ul class="cta-meta mono" data-rise></ul>
      </div>
      <div class="lead-form-slot" data-form-slot="inline" data-rise></div>
    </div>
  </section>
</main>

<div class="lead-modal" id="leadModal" aria-hidden="true">
  <div class="lead-modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalFormTitle">
    <button class="lead-modal-close mono" type="button"></button>
    <div class="lead-modal-slot" data-form-slot="modal"></div>
  </div>
</div>

<footer class="foot"><div class="wrap foot-grid mono"></div></footer>

<script type="module" src="js/ui.js"></script>
<script type="module" src="js/calculator.js"></script>
</body>
</html>
